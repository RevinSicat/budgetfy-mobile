name: budgetfy
description: "A new Flutter project."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.5.6
  shared_preferences: ^2.5.3
  restart_app: ^1.0.2
  intl: ^0.19.0
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  connectivity_plus: ^6.0.0
  uuid: ^4.4.0
  fl_chart: ^0.70.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  drift_dev: ^2.18.0
  build_runner: ^2.4.0

flutter_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: "assets/appIcon.png"
  image_path: "assets/appIcon.png"

flutter:
  uses-material-design: true
